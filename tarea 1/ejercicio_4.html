<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 4 - Potencia</title>
</head>
<body>

    <table>
        <tr>
            <td>Base (A):</td>
        </tr>
        <tr>
            <td><input type="text" id="base"></td>
        </tr>
        <tr>
            <td>Exponente (B):</td>
        </tr>
        <tr>
            <td><input type="text" id="exponente"></td>
        </tr>
        <tr>
            <td>Resultado:</td>
        </tr>
        <tr>
            <td id="resultado"></td>
        </tr>
        <tr>
            <td><button onclick="calcularPotencia()">Calcular</button></td>
        </tr>
    </table>

    <script>
        function calcularPotencia() {
            let base = parseFloat(document.getElementById("base").value);
            let exponente = parseInt(document.getElementById("exponente").value);
            
            let resultado = 1;
            let exponentePositivo = Math.abs(exponente);
            
            // Multiplicación repetida
            for (let i = 0; i < exponentePositivo; i++) {
                resultado = resultado * base;
            }
            
            // Si exponente es negativo → 1 / resultado
            if (exponente < 0) {
                resultado = 1 / resultado;
            }
            
            // Si exponente es 0 → cualquier base⁰ = 1
            if (exponente === 0) {
                resultado = 1;
            }

            document.getElementById("resultado").innerHTML = 
                base + " elevado a " + exponente + " = " + resultado;
        }
    </script>

</body>
</html>
